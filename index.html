<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manajemen Buku + Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container py-4">
    <!-- Login Form -->
    <div id="loginSection" class="card mx-auto p-4" style="max-width: 400px;">
      <h4 class="mb-3">Login</h4>
      <div class="mb-3">
        <input type="text" id="usernameInput" class="form-control" placeholder="Username">
      </div>
      <div class="mb-3">
        <input type="password" id="passwordInput" class="form-control" placeholder="Password">
      </div>
      <button onclick="login()" class="btn btn-primary w-100">Login</button>
      <p id="loginMessage" class="text-danger mt-3"></p>
    </div>

    <!-- App Section -->
    <div id="appSection" style="display: none;">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">📚 Manajemen Buku + Pagination</h2>
        <div>
          <span id="welcomeUser" class="me-3 text-primary fw-semibold"></span>
          <button class="btn btn-sm btn-outline-danger" onclick="logout()">Logout</button>
        </div>
      </div>

      <!-- Form Input Buku -->
      <div class="card mb-4">
        <div class="card-body">
          <form onsubmit="submitBuku(event)">
            <div class="row g-2">
              <div class="col-md-3">
                <input type="text" class="form-control" id="cover" placeholder="URL Gambar Cover" />
              </div>
              <div class="col-md-3">
                <input type="text" class="form-control" id="judul" placeholder="Judul Buku" />
              </div>
              <div class="col-md-3">
                <input type="text" class="form-control" id="penulis" placeholder="Penulis Buku" />
              </div>
              <div class="col-md-1">
                <input type="number" class="form-control" id="halaman" placeholder="Page" />
              </div>
              <div class="col-md-1">
                <input type="number" class="form-control" id="tahun" placeholder="Tahun" />
              </div>
              <div class="col-md-1 d-grid">
                <button class="btn btn-primary" type="submit">Tambah</button>
              </div>
            </div>
          </form>
        </div>
      </div>

      <div id="alertBerhasil" class="alert alert-success d-none" role="alert">
        Data Berhasil ditambahkan!
      </div>

      <!-- Daftar Buku -->
      <div id="daftarBuku" class="row g-3"></div>
      <!-- Pagination -->
      <div id="pagination" class="mt-4 d-flex justify-content-center"></div>
    </div>
  </div>

  <script>
    const users = [
      { username: "adi", password: "123" },
      { username: "Adi", password: "octavarium" },
      { username: "admin", password: "admin" },
    ];

    const API = "http://localhost:3000/books";
    let semuaBuku = [];
    let halamanAktif = 1;
    const bukuPerHalaman = 6;

    class Book {
      constructor(judul, penulis, halaman, tahun, cover) {
        this.judul = judul;
        this.penulis = penulis;
        this.halaman = halaman;
        this.tahun = tahun;
        this.cover = cover;
      }
    }

    function login() {
      const username = document.getElementById("usernameInput").value.trim();
      const password = document.getElementById("passwordInput").value.trim();
      const user = users.find(u => u.username === username && u.password === password);

      if (user) {
        localStorage.setItem("isLoggedIn", "true");
        localStorage.setItem("username", username);
        tampilkanApp();
      } else {
        document.getElementById("loginMessage").textContent = "Username atau password salah";
      }
    }

    function logout() {
      localStorage.removeItem("isLoggedIn");
      localStorage.removeItem("username");
      location.reload();
    }

    function tampilkanApp() {
      document.getElementById("loginSection").style.display = "none";
      document.getElementById("appSection").style.display = "block";
      const namaUser = localStorage.getItem("username");
      document.getElementById("welcomeUser").textContent = `Hello, ${namaUser}!`;
      ambilSemuaBuku();
    }

    async function submitBuku(event) {
      event.preventDefault();
      const cover = document.getElementById("cover").value.trim();
      const judul = document.getElementById("judul").value.trim();
      const penulis = document.getElementById("penulis").value.trim();
      const halamanInput = document.getElementById("halaman").value.trim();
      const tahunInput = document.getElementById("tahun").value.trim();
      const tahunSekarang = new Date().getFullYear();

      const errors = [];
      if (!cover) errors.push("Link cover tidak boleh kosong");
      if (!judul) errors.push("Judul tidak boleh kosong");
      if (!penulis) errors.push("Penulis tidak boleh kosong");
      if (!halamanInput || isNaN(halamanInput) || Number(halamanInput) < 1) errors.push("Halaman tidak valid");
      if (!tahunInput || isNaN(tahunInput) || tahunInput < 1450 || tahunInput > tahunSekarang) errors.push(`Tahun harus antara 1450 - ${tahunSekarang}`);
      if (errors.length > 0) return alert(errors.join("\n"));

      const book = new Book(judul, penulis, Number(halamanInput), Number(tahunInput), cover);
      await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(book),
      });
      document.getElementById("alertBerhasil").classList.remove("d-none");
      setTimeout(() => document.getElementById("alertBerhasil").classList.add("d-none"), 3000);
      event.target.reset();
      await ambilSemuaBuku();
    }

    async function ambilSemuaBuku() {
      const res = await fetch(API);
      semuaBuku = await res.json();
      tampilkanHalaman(halamanAktif);
    }

    function tampilkanHalaman(nomorHalaman) {
      halamanAktif = nomorHalaman;
      const awal = (nomorHalaman - 1) * bukuPerHalaman;
      const akhir = awal + bukuPerHalaman;
      const daftar = semuaBuku.slice(awal, akhir);

      const container = document.getElementById("daftarBuku");
      container.innerHTML = "";
      daftar.forEach(buku => {
        const div = document.createElement("div");
        div.className = "col-md-4";
        div.innerHTML = `
          <div class="card shadow-sm p-3">
            <img src="${buku.cover}" alt="Cover Buku" class="img-fluid mb-2" style="height: 150px; object-fit: contain;">
            <h5>${buku.judul}</h5>
            <p>Penulis: ${buku.penulis}</p>
            <p>Halaman: ${buku.halaman}</p>
            <p>Tahun: ${buku.tahun}</p>
            <div class="d-flex justify-content-end gap-2">
              <button class="btn btn-sm btn-warning" onclick="editBuku('${buku.id}')">Edit</button>
              <button class="btn btn-sm btn-danger" onclick="hapusBuku('${buku.id}')">Hapus</button>
            </div>
          </div>`;
        container.appendChild(div);
      });

      tampilkanPagination(Math.ceil(semuaBuku.length / bukuPerHalaman));
    }

    function tampilkanPagination(totalHalaman) {
      const pagination = document.getElementById("pagination");
      pagination.innerHTML = "";
      for (let i = 1; i <= totalHalaman; i++) {
        const btn = document.createElement("button");
        btn.className = `btn btn-sm ${halamanAktif === i ? "btn-primary" : "btn-outline-primary"} mx-1`;
        btn.innerText = i;
        btn.onclick = () => tampilkanHalaman(i);
        pagination.appendChild(btn);
      }
    }

    async function hapusBuku(id) {
      if (confirm("Yakin ingin menghapus buku ini?")) {
        await fetch(`${API}/${id}`, { method: "DELETE" });
        await ambilSemuaBuku();
      }
    }

    async function editBuku(id) {
      const buku = semuaBuku.find((b) => b.id === id);
      if (!buku) return alert("Data tidak ditemukan");
      const judul = prompt("Edit Judul:", buku.judul);
      const penulis = prompt("Edit Penulis:", buku.penulis);
      const halaman = prompt("Edit Halaman:", buku.halaman);
      const tahun = prompt("Edit Tahun:", buku.tahun);
      const tahunSekarang = new Date().getFullYear();
      const errors = [];
      if (!judul) errors.push("Judul tidak boleh kosong");
      if (!penulis) errors.push("Penulis tidak boleh kosong");
      if (!halaman || isNaN(halaman) || halaman < 1) errors.push("Halaman tidak valid");
      if (!tahun || isNaN(tahun) || tahun < 1450 || tahun > tahunSekarang) errors.push("Tahun tidak valid");
      if (errors.length > 0) return alert(errors.join("\n"));
      const book = new Book(judul, penulis, Number(halaman), Number(tahun), buku.cover);
      await fetch(`${API}/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(book),
      });
      await ambilSemuaBuku();
    }

    // Jalankan saat halaman dibuka
    if (localStorage.getItem("isLoggedIn") === "true") {
      tampilkanApp();
    }
  </script>
</body>
</html>
